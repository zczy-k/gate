name: VPN Gate Node Check

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
 

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: gate-check
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Get VPN Gate nodes + check via Cloudflare Worker + build page
        run: python vpngate.py
        env:
          # 已部署的检测 Worker (不要改动: 检测统一走这里)
          CHECK_WORKER: ${{ secrets.DOMAIN }}
          CHECK_CONCURRENCY: "32"
          CHECK_TIMEOUT: "90"
          # ---- 自动优选入口池配置 ----
          EDGE_POOL_LIMIT: "0"   # 0 表示用全部池
          EDGE_FANOUT: "1"       # 如想开启客户端 urltest 自选，改为 2~3
          EDGE_ISP: ""           # 空=全运营商；改为 CU/CM/CT 可按自己运营商限定
          EDGE_DOMAIN_DNS_CHECK: "on"    # on=分级判定(推荐) / strict=境外解析不到就剔 / off=不校验
          # ---- 历史累积复测 (官方每轮只公布约 100 台, 靠跨轮累积把候选做大) ----
          HISTORY_RECHECK: "1"   # 0=关闭, 只用官方当轮列表
          HISTORY_DAYS: "14"     # 连续多少天没复测成功就淘汰该历史节点
          HISTORY_MAX: "400"     # 复测总量上限 (84 台实测约 18s, 400 台约 90s)
          # EDGE_DOH_ECS: "223.5.5.5"    # 加中国方向 ECS 再问一次; 实测对万网分线路域名无效, 默认关
          # ---- 中转池 (CF 反代 IP, 不做 Cloudflare 段校验, 只探活) ----
          EDGE_RELAY_MODE: "file"        # off=关闭 / file=单独产出 nodes-relay.txt / append=按比例混进 nodes.txt
          EDGE_RELAY_LIMIT: "120"        # 探活候选总上限 (最坏耗时 ≈ 120*4s/8 ≈ 60s)
          EDGE_RELAY_QUOTA: "60"         # 每个源最多贡献多少条, 防止一家吃满 (0=不限)
          EDGE_RELAY_TIMEOUT: "4"        # 单个 TCP/TLS 探测超时(秒)
          EDGE_RELAY_CONCURRENCY: "8"    # 探活并发, 别调太高避免被判滥用扫描
          EDGE_RELAY_EVERY: "4"          # append 模式下每 N 条主池入口插 1 条中转
          # EDGE_RELAY_SNI: "你的伪装域名.com"   # 取消注释并填写: 探活从「仅 TCP 可连」升级为「TLS 透传 + CF 证书校验」

      - name: Ensure GitHub Pages is enabled (one-time auto setup)
        run: |
          code=$(curl -s -o /dev/null -w '%{http_code}' \
            -H "Authorization: Bearer $GITHUB_TOKEN" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/pages")
          echo "Pages API status: $code"
          if [ "$code" = "404" ]; then
            echo "首次运行: 启用 GitHub Pages (source = GitHub Actions, 目录 /public)"
            curl -sS -X PUT \
              -H "Authorization: Bearer $GITHUB_TOKEN" \
              -H "Content-Type: application/json" \
              -d '{"build_type":"workflow","source":{"branches":["main"],"path":"/public"}}' \
              "https://api.github.com/repos/$GITHUB_REPOSITORY/pages"
            echo
            sleep 10
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'public'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Show site URL
        run: 'echo "site: https://仓库用户名.github.io/gate/ (deploy outcome: ${{ steps.deployment.outcome }})"'
